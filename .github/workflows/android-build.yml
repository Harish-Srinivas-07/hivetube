name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.9"
  GRADLE_OPTS: -Dorg.gradle.project.kotlin.incremental=false -Dorg.gradle.caching=true

jobs:
  build-release:
    name: Build and publish Android APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read release version from pubspec.yaml
        id: version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml | cut -d '+' -f 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid or missing version in pubspec.yaml: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Save universal APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/HiveTube_${{ steps.version.outputs.version }}_universal.apk"

      - name: Build common ARM64 release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Save common APK
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/HiveTube_${{ steps.version.outputs.version }}_common.apk"
          for APK in dist/*.apk; do
            test -s "$APK"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HiveTube ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true
          make_latest: true
