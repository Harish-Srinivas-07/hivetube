name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.6"
  GRADLE_OPTS: -Dorg.gradle.project.kotlin.incremental=false -Dorg.gradle.caching=true

jobs:
  build-release:
    name: Build and publish Android APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CMake
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager "cmake;3.22.1"; then
              exit 0
            fi
            echo "CMake installation failed (attempt $attempt of 3)." >&2
            if [[ "$attempt" -lt 3 ]]; then
              sleep 10
            fi
          done
          exit 1

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo 'Missing Android release signing secrets.' >&2
            exit 1
          }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/hivetube-upload.jks
          printf 'storeFile=../hivetube-upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - name: Read release version from pubspec.yaml
        id: version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml | cut -d '+' -f 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid or missing version in pubspec.yaml: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Save universal APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/HiveTube_${{ steps.version.outputs.version }}_universal.apk"

      - name: Build common ARM64 release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Save common APK
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/HiveTube_${{ steps.version.outputs.version }}_common.apk"
          for APK in dist/*.apk; do
            test -s "$APK"
          done

      - name: Verify release signatures
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"

          EXPECTED="$(keytool -list -v \
            -keystore android/hivetube-upload.jks \
            -storepass:env STORE_PASSWORD \
            -alias "$KEY_ALIAS" |
            sed -n 's/^[[:space:]]*SHA256: //p' |
            tr -d ':' |
            tr '[:upper:]' '[:lower:]')"

          test -n "$EXPECTED"

          for APK in dist/*.apk; do
            echo "Verifying $APK"

            CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
            printf '%s\n' "$CERTS"

            ACTUAL="$(printf '%s\n' "$CERTS" |
              sed -nE 's/^(V[0-9]+ Signer|Signer #[0-9]+): certificate SHA-256 digest: //p' |
              head -1 |
              tr '[:upper:]' '[:lower:]')"

            if [[ "$ACTUAL" != "$EXPECTED" ]]; then
              echo "Signature mismatch for $APK" >&2
              echo "Expected: $EXPECTED" >&2
              echo "Actual:   $ACTUAL" >&2
              exit 1
            fi

            echo "Signature verified successfully: $APK"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HiveTube ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true
          make_latest: true
