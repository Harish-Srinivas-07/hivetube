name: hivetube
description: "HiveTube is a Flutter client for browsing and watching YouTube videos and Shorts."
publish_to: 'none'

version: 1.0.3+3

environment:
  sdk: ">3.12.0 < 4.0.0"

dependencies:
  flutter:
    sdk: flutter

  go_router: ^18.1.4
  flutter_riverpod: ^3.5.0
  dio: ^5.11.1
  drift: ^2.35.4
  drift_flutter:
  path_provider:
  xml:
  cached_network_image: ^4.0.3
  lucide_icons_flutter: ^4.0.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video:
  crypto:
  screen_brightness:
  volume_controller:
  wakelock_plus:
  audio_service:
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  file_picker: ^13.3.3
dependency_overrides:
  media_kit:
    path: third_party/media_kit

dev_dependencies:
  flutter_launcher_icons:
  flutter_test:
    sdk: flutter

  flutter_lints:
  drift_dev:
  build_runner:

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/launcher.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/launcher-foreground.png
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: assets/brand/launcher-monochrome.png
  image_path_ios_dark_transparent: assets/brand/launcher-dark.png
  image_path_ios_tinted_grayscale: assets/brand/launcher-tinted.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/innertube_clients.json
    - assets/brand/logo.png

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope[wght].ttf
